<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Soccer Training Designer v2</title>
<style>
  :root {
    --bg-deep: #0a0e0a;
    --field-dark: #1f4a2c;
    --field-mid: #2a5a37;
    --field-light: #336b41;
    --accent: #ffdd00;
    --accent-glow: rgba(255, 221, 0, 0.4);
    --player-blue: #2563eb;
    --player-red: #dc2626;
    --player-yellow: #fbbf24;
    --cone-orange: #ff6b1a;
    --arrow-pass: #4ade80;
    --arrow-shoot: #f87171;
    --arrow-dribble: #ffdd00;
    --ui-bg: rgba(15, 20, 15, 0.94);
    --ui-bg-solid: #14191a;
    --ui-border: rgba(255, 221, 0, 0.25);
    --text: #f5f5f0;
    --text-dim: #a0a89c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    font-family: 'Helvetica Neue', 'Hiragino Sans', sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--ui-bg);
    border-bottom: 1px solid var(--ui-border);
    z-index: 50;
    flex-shrink: 0;
    gap: 8px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    letter-spacing: 0.05em;
    font-size: 13px;
    flex-shrink: 0;
  }
  .logo-mark {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent);
    display: grid; place-items: center;
    color: #000; font-size: 12px;
  }
  .logo-text span { color: var(--accent); }

  .scenes-bar {
    flex: 1;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 0 4px;
    scrollbar-width: none;
  }
  .scenes-bar::-webkit-scrollbar { display: none; }

  .scene-tab {
    background: rgba(255,255,255,0.05);
    border: 1px solid transparent;
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0;
  }
  .scene-tab.active {
    background: rgba(255, 221, 0, 0.15);
    border-color: var(--accent);
    color: var(--accent);
  }
  .scene-num {
    background: rgba(0,0,0,0.4);
    border-radius: 50%;
    width: 16px; height: 16px;
    display: grid; place-items: center;
    font-size: 10px; font-weight: 700;
  }
  .scene-tab.active .scene-num { background: var(--accent); color: #000; }
  .scene-add {
    background: transparent;
    border: 1px dashed var(--text-dim);
    color: var(--text-dim);
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
  }
  .scene-add:hover { color: var(--accent); border-color: var(--accent); }

  .top-actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }

  .icon-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 8px;
    display: grid; place-items: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .icon-btn:hover, .icon-btn.active {
    background: rgba(255, 221, 0, 0.12);
    border-color: var(--ui-border);
  }
  .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

  .field-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--field-mid);
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  .field-wrap::before {
    /* Stripes are now drawn on canvas — disable CSS pattern */
    display: none;
  }
  .field-wrap.no-stripes::before {
    display: none;
  }

  .toolbar {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    border-radius: 12px;
    padding: 6px;
    z-index: 30;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    max-height: calc(100% - 24px);
    overflow-y: auto;
    scrollbar-width: none;
  }
  .toolbar::-webkit-scrollbar { display: none; }

  .tool {
    width: 42px; height: 42px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: rgba(255,255,255,0.03);
    color: var(--text);
    cursor: pointer;
    display: grid; place-items: center;
    transition: all 0.15s;
    position: relative;
    flex-shrink: 0;
  }
  .tool:hover { background: rgba(255, 221, 0, 0.1); }
  .tool.active {
    background: rgba(255, 221, 0, 0.2);
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255, 221, 0, 0.15);
  }

  .tool-label {
    position: absolute;
    left: 52px; top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.9);
    color: var(--accent);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 100;
  }
  .tool:hover .tool-label { opacity: 1; }

  .tool-divider {
    height: 1px;
    background: var(--ui-border);
    margin: 3px 2px;
    flex-shrink: 0;
  }

  .icon-player {
    width: 22px; height: 26px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-player svg { width: 100%; height: 100%; }
  .icon-player .num {
    position: absolute;
    color: white;
    font-size: 8px;
    font-weight: 800;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -25%);
    pointer-events: none;
    line-height: 1;
  }
  .icon-player.yellow .num { color: #222; }
  .icon-cone {
    width: 0; height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 16px solid var(--cone-orange);
    position: relative;
  }
  .icon-cone::after {
    content: '';
    position: absolute;
    bottom: -1px; left: -7px;
    width: 14px; height: 2px;
    background: white;
  }
  .icon-ball {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: white;
    border: 1px solid #333;
  }
  .icon-goal {
    width: 24px; height: 12px;
    border: 2px solid white;
    border-bottom: none;
    border-radius: 2px 2px 0 0;
  }
  .arrow-preview {
    width: 24px; height: 14px;
    position: relative;
  }
  .arrow-preview svg { width: 100%; height: 100%; }

  .bottombar {
    background: var(--ui-bg);
    border-top: 1px solid var(--ui-border);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 50;
    flex-shrink: 0;
  }

  .play-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--accent);
    color: #000;
    border: none;
    cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 0 16px var(--accent-glow);
    transition: transform 0.1s;
    flex-shrink: 0;
  }
  .play-btn:active { transform: scale(0.94); }
  .play-btn svg { width: 18px; height: 18px; fill: currentColor; }

  .timeline-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .timeline-info {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-dim);
  }
  .timeline-info b { color: var(--accent); font-weight: 600; }

  .timeline {
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .timeline-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #ff9500);
    width: 0%;
    transition: width 0.05s linear;
  }

  .speed-toggle {
    display: flex;
    background: rgba(0,0,0,0.4);
    border-radius: 8px;
    padding: 2px;
    gap: 1px;
    flex-shrink: 0;
  }
  .speed-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
  }
  .speed-btn.active {
    background: var(--accent);
    color: #000;
  }

  .play-all-btn {
    background: rgba(74, 222, 128, 0.15);
    border: 1px solid rgba(74, 222, 128, 0.4);
    color: #4ade80;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .play-all-btn:hover { background: rgba(74, 222, 128, 0.25); }

  .hint {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    color: var(--accent);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 12px;
    z-index: 25;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    max-width: 80%;
    text-align: center;
    line-height: 1.5;
  }
  .hint.show { opacity: 1; }

  .rec-banner {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(220, 38, 38, 0.95);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    z-index: 26;
    display: none;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 16px rgba(220, 38, 38, 0.5);
    max-width: 90%;
  }
  .rec-banner.show { display: flex; }
  .rec-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: white;
    animation: pulse 1s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .rec-cancel {
    background: rgba(0,0,0,0.3);
    border: none;
    color: white;
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 10px;
    cursor: pointer;
    font-weight: 600;
  }

  .arrow-banner {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ui-bg);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    z-index: 26;
    display: none;
    align-items: center;
    gap: 10px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .arrow-banner.show { display: flex; }

  @media (max-width: 768px) {
    .toolbar {
      left: 50%;
      top: auto;
      bottom: 70px;
      transform: translateX(-50%);
      flex-direction: row;
      padding: 5px;
      max-width: calc(100% - 20px);
      overflow-x: auto;
      max-height: none;
    }
    .tool { width: 38px; height: 38px; }
    .tool-label { display: none; }
    .tool-divider {
      width: 1px;
      height: auto;
      margin: 2px 3px;
    }
    .bottombar { padding: 6px 10px; gap: 6px; }
    .play-btn { width: 38px; height: 38px; }
    .speed-toggle { display: none; }
    .play-all-btn { padding: 4px 8px; font-size: 10px; }
    .scene-tab { padding: 4px 8px; font-size: 11px; }
    .logo-text { display: none; }
  }

  .menu {
    position: absolute;
    top: 56px;
    right: 12px;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    border-radius: 10px;
    padding: 4px;
    z-index: 100;
    min-width: 180px;
    display: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .menu.show { display: block; }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  .menu-item:hover { background: rgba(255, 221, 0, 0.1); }

  /* Toggle switch */
  input[type="checkbox"]::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: white;
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  input[type="checkbox"]:checked {
    background: var(--accent) !important;
  }
  input[type="checkbox"]:checked::after {
    transform: translateX(16px);
  }
  .menu-item svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    backdrop-filter: blur(4px);
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--ui-bg-solid);
    border: 1px solid var(--ui-border);
    border-radius: 14px;
    padding: 18px;
    width: 90%;
    max-width: 320px;
  }
  .modal h3 {
    color: var(--accent);
    margin-bottom: 12px;
    font-size: 14px;
    letter-spacing: 0.05em;
  }
  .modal input {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--ui-border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .modal input:focus { outline: none; border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
  }
  .modal-btn.primary { background: var(--accent); color: #000; }
  .modal-btn.secondary { background: rgba(255,255,255,0.1); color: var(--text); }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="logo">
      <div class="logo-mark">⚽</div>
      <div class="logo-text">TRAINING<span>.</span>BOARD</div>
    </div>
    <div class="scenes-bar" id="scenesBar"></div>
    <div class="top-actions">
      <button class="icon-btn" id="undoBtn" title="元に戻す">
        <svg viewBox="0 0 24 24"><path d="M3 7v6h6M3 13a9 9 0 1 0 3-7"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="設定">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="menuBtn" title="メニュー">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
    </div>
  </div>

  <div class="menu" id="settingsPanel" style="right: 56px;">
    <div style="font-size: 10px; color: #a0a89c; padding: 6px 12px 4px; letter-spacing: 0.05em; font-weight: 600;">
      設定
    </div>
    <div style="padding: 0 12px 8px;">
      <label style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0; cursor: pointer; font-size: 13px;">
        <span>フィールドラインを表示</span>
        <input type="checkbox" id="settingShowLines" checked style="
          width: 36px; height: 20px;
          appearance: none;
          -webkit-appearance: none;
          background: rgba(255,255,255,0.15);
          border-radius: 10px;
          position: relative;
          cursor: pointer;
          outline: none;
          transition: background 0.2s;
          flex-shrink: 0;
        ">
      </label>
      <label style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0; cursor: pointer; font-size: 13px;">
        <span>ストライプ模様を表示</span>
        <input type="checkbox" id="settingShowStripes" checked style="
          width: 36px; height: 20px;
          appearance: none;
          -webkit-appearance: none;
          background: rgba(255,255,255,0.15);
          border-radius: 10px;
          position: relative;
          cursor: pointer;
          outline: none;
          transition: background 0.2s;
          flex-shrink: 0;
        ">
      </label>
    </div>
  </div>

  <div class="menu" id="menu">
    <div class="menu-item" data-action="renameScene">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      シーン名を変更
    </div>
    <div class="menu-item" data-action="duplicateScene">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      シーンを複製
    </div>
    <div class="menu-item" data-action="deleteScene">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      シーンを削除
    </div>
    <div class="menu-item" data-action="clearScene">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-7"/><path d="M21 4v5h-5"/></svg>
      シーンをクリア
    </div>
    <div class="menu-item" data-action="save">
      <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8"/></svg>
      JSON保存
    </div>
    <div class="menu-item" data-action="load">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5-5 5 5M12 5v12"/></svg>
      JSON読み込み
    </div>
    <div class="menu-item" data-action="help">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r="0.5"/></svg>
      使い方
    </div>
  </div>

  <div class="field-wrap" id="fieldWrap">
    <canvas id="bgCanvas"></canvas>
    <canvas id="pathCanvas"></canvas>
    <canvas id="iconCanvas"></canvas>

    <div class="toolbar" id="toolbar">
      <button class="tool active" data-tool="select">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3l7 17 2-7 7-2L3 3z"/>
        </svg>
        <span class="tool-label">選択 / 移動</span>
      </button>
      <div class="tool-divider"></div>
      <button class="tool" data-tool="player-blue">
        <div class="icon-player">
          <svg viewBox="0 0 22 28" fill="none">
            <!-- legs (skin) -->
            <!-- legs (skin upper, sock lower) -->
            <path d="M7.2 21 L9.3 21 L9.3 23 L7.3 23 Z" fill="#e8c5a0"/>
            <path d="M12.7 21 L14.8 21 L14.7 23 L12.7 23 Z" fill="#e8c5a0"/>
            <!-- socks -->
            <path d="M7.3 23 L9.3 23 L9.3 25.5 L7.5 25.5 Z" fill="#2563eb"/>
