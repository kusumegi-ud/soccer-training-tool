<script>
(() => {
  const fieldWrap = document.getElementById('fieldWrap');
  const bgCanvas   = document.getElementById('bgCanvas');
  const pathCanvas = document.getElementById('pathCanvas');
  const iconCanvas = document.getElementById('iconCanvas');
  const bgCtx   = bgCanvas.getContext('2d');
  const pathCtx = pathCanvas.getContext('2d');
  const iconCtx = iconCanvas.getContext('2d');

  const project = {
    scenes: [
      { name: 'シーン 1', objects: [], arrows: [], drawings: [], duration: 0 }
    ],
    activeIdx: 0,
    counters: { blue: 0, red: 0, yellow: 0 },
  };

  const ui = {
    tool: 'select',
    selectedId: null,
    recording: false,
    recordingTargetId: null,
    recordStartTime: 0,
    recordPath: [],
    arrowDrawing: null,
    penStroke: null,
    playing: false,
    playStart: 0,
    playTime: 0,
    speed: 1,
    dragging: null,
    history: [],
    _lastTapId: null,
    playAll: false,
    playAllSceneIdx: 0,
  };

  // App-wide settings (saved to localStorage)
  const settings = {
    showLines: true,
    showStripes: true,
  };
  // Load saved settings
  try {
    const saved = localStorage.getItem('trainingBoardSettings');
    if (saved) {
      const obj = JSON.parse(saved);
      Object.assign(settings, obj);
    }
  } catch (_) {}
  function saveSettings() {
    try {
      localStorage.setItem('trainingBoardSettings', JSON.stringify(settings));
    } catch (_) {}
  }

  let DPR = Math.max(1, window.devicePixelRatio || 1);
  let W = 0, H = 0;
  const scene = () => project.scenes[project.activeIdx];

  function resize() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    const rect = fieldWrap.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    [bgCanvas, pathCanvas, iconCanvas].forEach(c => {
      c.width  = Math.floor(W * DPR);
      c.height = Math.floor(H * DPR);
      c.style.width  = W + 'px';
      c.style.height = H + 'px';
    });
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    pathCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    iconCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawBackground();
    redraw();
  }
  window.addEventListener('resize', resize);

  // Cached grass texture canvas (regenerated on resize)
  let grassCanvas = null;
  let grassW = 0, grassH = 0;

  function generateGrassTexture(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const g = c.getContext('2d');

    // 1) Base gradient — slightly varying green
    const baseGrad = g.createLinearGradient(0, 0, 0, h);
    baseGrad.addColorStop(0, '#2d5f2e');
    baseGrad.addColorStop(0.5, '#357c38');
    baseGrad.addColorStop(1, '#2d5f2e');
    g.fillStyle = baseGrad;
    g.fillRect(0, 0, w, h);

    // 2) Mowing stripes (alternate light/dark bands)
    if (settings.showStripes) {
      const stripeW = 60;
      for (let x = 0; x < w; x += stripeW * 2) {
        g.fillStyle = 'rgba(255,255,255,0.06)';
        g.fillRect(x, 0, stripeW, h);
        g.fillStyle = 'rgba(0,0,0,0.06)';
        g.fillRect(x + stripeW, 0, stripeW, h);
      }
    }

    // 3) Random noise speckles (color variation)
    const imgData = g.getImageData(0, 0, w, h);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      const noise = (Math.random() - 0.5) * 30;
      data[i]   = Math.max(0, Math.min(255, data[i]   + noise));     // R
      data[i+1] = Math.max(0, Math.min(255, data[i+1] + noise * 1.2)); // G (more variation)
      data[i+2] = Math.max(0, Math.min(255, data[i+2] + noise));     // B
    }
    g.putImageData(imgData, 0, 0);

    // 4) Tiny grass blades (short vertical strokes)
    const bladeCount = Math.floor((w * h) / 80);
    for (let i = 0; i < bladeCount; i++) {
      const x = Math.random() * w;
      const y = Math.random() * h;
      const len = 2 + Math.random() * 3;
      const lightness = Math.random();
      // Mix of darker and lighter blades
      if (lightness < 0.4) {
        g.strokeStyle = `rgba(50, 90, 50, ${0.3 + Math.random() * 0.3})`;
      } else if (lightness < 0.8) {
        g.strokeStyle = `rgba(120, 160, 80, ${0.2 + Math.random() * 0.3})`;
      } else {
        g.strokeStyle = `rgba(180, 200, 120, ${0.15 + Math.random() * 0.2})`;
      }
      g.lineWidth = 0.6;
      g.beginPath();
      g.moveTo(x, y);
      // slight angle for natural look
      const angle = (Math.random() - 0.5) * 0.6;
      g.lineTo(x + Math.sin(angle) * len, y - Math.cos(angle) * len);
      g.stroke();
    }

    return c;
  }

  function drawBackground() {
    bgCtx.clearRect(0, 0, W, H);

    // Draw realistic grass texture
    if (!grassCanvas || grassW !== W || grassH !== H) {
      grassCanvas = generateGrassTexture(W, H);
      grassW = W;
      grassH = H;
    }
    bgCtx.drawImage(grassCanvas, 0, 0);

    // Skip lines if user disabled them
    if (!settings.showLines) return;

    bgCtx.strokeStyle = 'rgba(255,255,255,0.7)';
    bgCtx.lineWidth = 2;
    const m = 20;
    bgCtx.strokeRect(m, m, W - 2*m, H - 2*m);
    bgCtx.beginPath();
    bgCtx.moveTo(m, H/2); bgCtx.lineTo(W - m, H/2); bgCtx.stroke();
    bgCtx.beginPath();
    bgCtx.arc(W/2, H/2, Math.min(W, H) * 0.12, 0, Math.PI * 2); bgCtx.stroke();
    bgCtx.beginPath();
    bgCtx.arc(W/2, H/2, 3, 0, Math.PI * 2);
    bgCtx.fillStyle = 'rgba(255,255,255,0.7)'; bgCtx.fill();
    const pbW = Math.min(W * 0.5, 360);
    const pbH = Math.min(H * 0.18, 100);
    bgCtx.strokeRect((W - pbW)/2, m, pbW, pbH);
    bgCtx.strokeRect((W - pbW)/2, H - m - pbH, pbW, pbH);
    const gaW = pbW * 0.5, gaH = pbH * 0.45;
    bgCtx.strokeRect((W - gaW)/2, m, gaW, gaH);
    bgCtx.strokeRect((W - gaW)/2, H - m - gaH, gaW, gaH);
  }

  function applyStripesSetting() {
    // Regenerate the grass texture with new stripe setting
    grassCanvas = null;
    drawBackground();
  }

  function drawObject(ctx, o) {
    ctx.save();
    ctx.translate(o.x, o.y);

    if (o.type.startsWith('player')) {
      const facing = o.facing || 'front';
      // For left/right we'll do a true side-view drawing.
      // For left, mirror at the end so the side-view code is shared with right.
      const isSide = (facing === 'left' || facing === 'right');
      if (facing === 'left') ctx.scale(-1, 1);

      // Slim athletic humanoid: flat colors, jersey + shorts
      const unit = o.r;
      const headR = unit * 0.45;
      const headY = -unit * 1.15;
      const neckH = unit * 0.12;
      const shoulderY = headY + headR + neckH;
      const shoulderW = unit * 1.15;
      const torsoH = unit * 1.15;
      const torsoBottomY = shoulderY + torsoH;
      const shortsH = unit * 0.55;
      const legH = unit * 1.0;
      const legW = unit * 0.32;
      const armLen = unit * 1.0;
      const armW = unit * 0.28;

      const skin = '#e8c5a0';
      const hair = '#2a1810';
      const shortsColor = '#1a1a1a';
      const jerseyColor = o.color;
      const numberColor = (o.color === '#fbbf24') ? '#222' : '#fff';

      if (isSide) {
        // ========== SIDE VIEW ==========
        // Right-facing reference (left is flipped via scale).
        // Stagger legs front/back to convey depth, single visible arm, profile head with nose.

        // Drop shadow under feet
        ctx.beginPath();
        ctx.ellipse(unit*0.05, torsoBottomY + shortsH + legH + 2, unit * 0.7, unit * 0.16, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fill();

        const sideTorsoW = unit * 0.75;  // narrower from the side
        const sideShortsW = sideTorsoW * 0.95;
        const legStartY = torsoBottomY + shortsH;

        // ===== Back leg (further away) — drawn first, slightly behind =====
        ctx.fillStyle = '#d4a981'; // slightly darker skin tone for distance
        const backLegX = -sideTorsoW * 0.15;
        roundRect(ctx, backLegX - legW/2, legStartY, legW * 0.9, legH * 0.95, legW * 0.35);
        ctx.fill();
        // Back leg sock (matches team color, slightly muted)
        const backSockTopY = legStartY + legH * 0.55;
        ctx.fillStyle = jerseyColor;
        ctx.globalAlpha = 0.85;
        ctx.fillRect(backLegX - legW/2, backSockTopY, legW * 0.9, legH * 0.42);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(backLegX - legW/2, backSockTopY, legW * 0.9, legH * 0.06);
        // Back leg shoe
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.moveTo(backLegX - legW * 0.5, legStartY + legH - unit*0.05);
        ctx.lineTo(backLegX + legW * 0.7, legStartY + legH - unit*0.05);
        ctx.lineTo(backLegX + legW * 0.85, legStartY + legH * 0.95);
        ctx.lineTo(backLegX - legW * 0.5, legStartY + legH * 0.95);
        ctx.closePath();
        ctx.fill();

        // ===== Back arm (subtle, slightly behind torso) =====
        ctx.fillStyle = '#d4a981';
        const backArmX = -sideTorsoW * 0.05;
        roundRect(ctx, backArmX - armW/2, shoulderY + unit*0.1, armW * 0.85, armLen * 0.95, armW * 0.4);
        ctx.fill();
        // Back arm sleeve
        ctx.fillStyle = jerseyColor;
        ctx.beginPath();
        ctx.moveTo(backArmX - armW*0.5, shoulderY + unit*0.05);
        ctx.quadraticCurveTo(backArmX, shoulderY - unit*0.05, backArmX + armW*0.5, shoulderY + unit*0.05);
        ctx.lineTo(backArmX + armW*0.45, shoulderY + armLen * 0.4);
        ctx.lineTo(backArmX - armW*0.45, shoulderY + armLen * 0.4);
        ctx.closePath();
        ctx.fill();

        // ===== Shorts (side view) =====
        ctx.fillStyle = shortsColor;
        ctx.beginPath();
        ctx.moveTo(-sideShortsW * 0.4, torsoBottomY - 1);
        ctx.lineTo(sideShortsW * 0.6, torsoBottomY - 1);
        ctx.quadraticCurveTo(sideShortsW * 0.7, torsoBottomY + shortsH * 0.5, sideShortsW * 0.5, torsoBottomY + shortsH);
        ctx.lineTo(-sideShortsW * 0.35, torsoBottomY + shortsH);
        ctx.quadraticCurveTo(-sideShortsW * 0.5, torsoBottomY + shortsH * 0.5, -sideShortsW * 0.4, torsoBottomY - 1);
        ctx.closePath();
        ctx.fill();

        // ===== Jersey (side view, narrower) =====
        ctx.fillStyle = jerseyColor;
        ctx.beginPath();
        // back side (left edge)
        ctx.moveTo(-sideTorsoW * 0.5, shoulderY + unit*0.05);
        // top of shoulder, slight curve forward
        ctx.quadraticCurveTo(-sideTorsoW * 0.3, shoulderY - unit*0.05, sideTorsoW * 0.5, shoulderY + unit*0.1);
        // chest bulge slightly forward
        ctx.quadraticCurveTo(sideTorsoW * 0.65, shoulderY + torsoH * 0.4, sideTorsoW * 0.5, torsoBottomY);
        // hem bottom
        ctx.lineTo(-sideTorsoW * 0.45, torsoBottomY);
        // back of torso curve
        ctx.quadraticCurveTo(-sideTorsoW * 0.55, shoulderY + torsoH * 0.5, -sideTorsoW * 0.5, shoulderY + unit*0.05);
        ctx.closePath();
        ctx.fill();

        // ===== Front leg (closer, drawn over shorts) =====
        ctx.fillStyle = skin;
        const frontLegX = sideTorsoW * 0.2;
        roundRect(ctx, frontLegX - legW/2, legStartY, legW, legH, legW * 0.4);
        ctx.fill();
        // Front leg sock (full team color, vibrant)
        const frontSockTopY = legStartY + legH * 0.55;
        ctx.fillStyle = jerseyColor;
        ctx.fillRect(frontLegX - legW/2, frontSockTopY, legW, legH * 0.42);
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(frontLegX - legW/2, frontSockTopY, legW, legH * 0.06);
        // Front shoe (with toe pointing forward = right)
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.moveTo(frontLegX - legW * 0.6, legStartY + legH - unit*0.05);
        ctx.lineTo(frontLegX + legW * 0.5, legStartY + legH - unit*0.1);
        // Long toe extends forward
        ctx.quadraticCurveTo(frontLegX + legW * 1.7, legStartY + legH - unit*0.05,
                              frontLegX + legW * 1.9, legStartY + legH * 0.98);
        ctx.lineTo(frontLegX + legW * 1.6, legStartY + legH * 1.02);
        ctx.lineTo(frontLegX - legW * 0.6, legStartY + legH * 1.02);
        ctx.closePath();
        ctx.fill();
        // Shoe stripe
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(frontLegX - legW * 0.3, legStartY + legH + unit*0.06);
        ctx.quadraticCurveTo(frontLegX + legW * 0.6, legStartY + legH + unit*0.18,
                              frontLegX + legW * 1.5, legStartY + legH * 0.99);
        ctx.stroke();

        // ===== Front arm (visible, slightly forward) =====
        ctx.fillStyle = skin;
        const frontArmX = sideTorsoW * 0.5;
        // Arm shape with slight forward angle
        ctx.beginPath();
        ctx.moveTo(frontArmX - armW*0.4, shoulderY + armLen * 0.4);
        ctx.lineTo(frontArmX + armW*0.4, shoulderY + armLen * 0.4);
        ctx.quadraticCurveTo(frontArmX + armW*0.6, shoulderY + armLen * 0.7,
                              frontArmX + armW*0.5, shoulderY + armLen);
        ctx.lineTo(frontArmX - armW*0.4, shoulderY + armLen);
        ctx.quadraticCurveTo(frontArmX - armW*0.5, shoulderY + armLen * 0.7,
                              frontArmX - armW*0.4, shoulderY + armLen * 0.4);
        ctx.closePath();
        ctx.fill();

        // Front sleeve (cap sleeve covering shoulder + upper arm)
        ctx.fillStyle = jerseyColor;
        ctx.beginPath();
        ctx.moveTo(frontArmX - armW*0.5, shoulderY + unit*0.05);
        ctx.quadraticCurveTo(frontArmX, shoulderY - unit*0.08,
                              frontArmX + armW*0.55, shoulderY + unit*0.08);
        ctx.lineTo(frontArmX + armW*0.55, shoulderY + armLen * 0.42);
        ctx.lineTo(frontArmX - armW*0.5, shoulderY + armLen * 0.42);
        ctx.closePath();
        ctx.fill();

        // ===== Number on jersey (side view) =====
        // Reset all transforms and re-translate to player center to draw upright text.
        ctx.save();
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);  // identity (with DPR)
        ctx.translate(o.x, o.y);
        ctx.fillStyle = numberColor;
        const fontSize = Math.round(torsoH * 0.4);
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // For both left and right, place number slightly forward of center
        const numXOffset = (facing === 'left') ? -sideTorsoW * 0.05 : sideTorsoW * 0.05;
        ctx.fillText(o.number, numXOffset, shoulderY + torsoH * 0.55);
        ctx.restore();

        // ===== Profile head (with nose) =====
        // Head circle
        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.arc(0, headY, headR, 0, Math.PI * 2);
        ctx.fill();
        // Nose - small triangle pointing forward (right)
        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.moveTo(headR * 0.85, headY - headR * 0.05);
        ctx.lineTo(headR * 1.15, headY + headR * 0.05);
        ctx.lineTo(headR * 0.85, headY + headR * 0.18);
        ctx.closePath();
        ctx.fill();
        // Nose outline
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(headR * 0.85, headY - headR * 0.05);
        ctx.lineTo(headR * 1.15, headY + headR * 0.05);
        ctx.lineTo(headR * 0.85, headY + headR * 0.18);
        ctx.stroke();

        // No hair (per user request)

        // Eye dot (small, on the visible cheek side)
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.arc(headR * 0.4, headY - headR * 0.05, headR * 0.1, 0, Math.PI * 2);
        ctx.fill();

        // Mouth (small line on the side, near the cheek/jaw)
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 1.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(headR * 0.6, headY + headR * 0.4);
        ctx.lineTo(headR * 0.85, headY + headR * 0.42);
        ctx.stroke();
      } else {
        // ========== FRONT / BACK VIEW (existing logic) ==========

      // ===== Drop shadow under feet =====
      ctx.beginPath();
      ctx.ellipse(0, torsoBottomY + shortsH + legH + 2, unit * 0.78, unit * 0.16, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fill();

      // ===== Legs (skin, below shorts) =====
      ctx.fillStyle = skin;
      const legStartY = torsoBottomY + shortsH;
      drawLeg(ctx, -legW * 1.1, legStartY, legW, legH);
      drawLeg(ctx, legW * 0.1, legStartY, legW, legH);

      // ===== Socks (lower portion of legs) =====
      const sockColor = jerseyColor;        // matching team color
      const sockTrim = '#1a1a1a';
      const sockTopY = legStartY + legH * 0.55;  // socks start at mid-calf
      const sockBottomY = legStartY + legH;
      const sockH = sockBottomY - sockTopY;

      [-1, 1].forEach(side => {
        const lx = (side === -1) ? -legW * 1.1 : legW * 0.1;
        // Sock body
        ctx.fillStyle = sockColor;
        ctx.beginPath();
        ctx.moveTo(lx, sockTopY);
        ctx.lineTo(lx + legW * 0.9, sockTopY);
        ctx.lineTo(lx + legW * 0.85, sockBottomY);
        ctx.lineTo(lx + legW * 0.05, sockBottomY);
        ctx.closePath();
        ctx.fill();
        // Top trim band (darker stripe at the top of the sock)
        ctx.fillStyle = sockTrim;
        ctx.fillRect(lx - 0.5, sockTopY, legW * 0.95, sockH * 0.15);
      });

      // ===== Spike shoes =====
      const shoeColor = '#1a1a1a';
      const shoeAccent = '#ffffff';
      const shoeY = legStartY + legH - unit*0.05;
      const shoeW = legW * 1.6;
      const shoeH = unit * 0.32;

      [-1, 1].forEach(side => {
        const cx = side * (legW * 0.65);
        // Shoe body — angled forward (toe slightly outward)
        ctx.fillStyle = shoeColor;
        ctx.beginPath();
        ctx.moveTo(cx - shoeW * 0.35, shoeY);
        ctx.lineTo(cx - legW * 0.4, shoeY);
        ctx.quadraticCurveTo(cx - legW * 0.2, shoeY - shoeH*0.15, cx + legW * 0.4, shoeY);
        ctx.lineTo(cx + shoeW * 0.55, shoeY + shoeH * 0.45);
        ctx.quadraticCurveTo(cx + shoeW * 0.6, shoeY + shoeH, cx + shoeW * 0.4, shoeY + shoeH);
        ctx.lineTo(cx - shoeW * 0.3, shoeY + shoeH);
        ctx.quadraticCurveTo(cx - shoeW * 0.4, shoeY + shoeH, cx - shoeW * 0.4, shoeY + shoeH * 0.5);
        ctx.closePath();
        ctx.fill();

        // White stripe accent (subtle, for visibility on dark green field)
        ctx.strokeStyle = shoeAccent;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(cx - shoeW * 0.15, shoeY + shoeH * 0.35);
        ctx.quadraticCurveTo(cx + shoeW * 0.15, shoeY + shoeH * 0.55, cx + shoeW * 0.45, shoeY + shoeH * 0.55);
        ctx.stroke();
      });

      // ===== Shorts =====
      ctx.fillStyle = shortsColor;
      const shortsW = shoulderW * 0.78;
      ctx.beginPath();
      // top of shorts (waist)
      ctx.moveTo(-shortsW/2, torsoBottomY - 1);
      ctx.lineTo(shortsW/2, torsoBottomY - 1);
      // right side curve down
      ctx.quadraticCurveTo(shortsW/2 + unit*0.05, torsoBottomY + shortsH*0.4, shortsW/2 - unit*0.02, torsoBottomY + shortsH);
      // right leg opening — small inward dip
      ctx.lineTo(unit*0.05, torsoBottomY + shortsH);
      // crotch dip
      ctx.quadraticCurveTo(0, torsoBottomY + shortsH * 0.7, -unit*0.05, torsoBottomY + shortsH);
      // left leg opening
      ctx.lineTo(-shortsW/2 + unit*0.02, torsoBottomY + shortsH);
      // left side curve up
      ctx.quadraticCurveTo(-shortsW/2 - unit*0.05, torsoBottomY + shortsH*0.4, -shortsW/2, torsoBottomY - 1);
      ctx.closePath();
      ctx.fill();

      // ===== Arms (skin, slim) =====
      ctx.fillStyle = skin;
      drawArm(ctx, -shoulderW/2 - armW*0.4, shoulderY + unit*0.05, armW, armLen, -1);
      drawArm(ctx, shoulderW/2 - armW*0.6, shoulderY + unit*0.05, armW, armLen, 1);

      // ===== Jersey (V-tapered, flat color, flat shoulders) =====
      ctx.fillStyle = jerseyColor;
      const waistW = shoulderW * 0.72;
      const collarDip = unit * 0.18;
      const flatShoulderY = shoulderY + unit*0.05;

      ctx.beginPath();
      // Left shoulder
      ctx.moveTo(-shoulderW/2, flatShoulderY);
      // Flat top to neck
      ctx.lineTo(-unit*0.18, flatShoulderY);
      // V-neck dip
      ctx.quadraticCurveTo(0, flatShoulderY + collarDip, unit*0.18, flatShoulderY);
      // Flat top to right shoulder
      ctx.lineTo(shoulderW/2, flatShoulderY);
      // Right side — taper to waist
      ctx.quadraticCurveTo(shoulderW*0.5, flatShoulderY + torsoH*0.45, waistW/2, torsoBottomY);
      // Hem
      ctx.lineTo(-waistW/2, torsoBottomY);
      // Left side back to shoulder
      ctx.quadraticCurveTo(-shoulderW*0.5, flatShoulderY + torsoH*0.45, -shoulderW/2, flatShoulderY);
      ctx.closePath();
      ctx.fill();

      // ===== Short sleeves — cover shoulder + upper arm =====
      // Flat shoulder line (no rugby pads, no shoulder bulge).
      const sleeveLen = armLen * 0.38;
      const sleeveTopY = shoulderY + unit*0.05;
      ctx.fillStyle = jerseyColor;

      // Left sleeve — straight horizontal top, shoulder is flush with torso top
      ctx.beginPath();
      ctx.moveTo(-shoulderW/2 + unit*0.02, sleeveTopY);
      // Outer top — flat horizontal
      ctx.lineTo(-shoulderW/2 - armW*0.5, sleeveTopY);
      // Outer side straight down to cuff
      ctx.lineTo(-shoulderW/2 - armW*0.5, sleeveTopY + sleeveLen);
      // Cuff bottom (slight inward)
      ctx.lineTo(-shoulderW/2 + unit*0.05, sleeveTopY + sleeveLen + unit*0.03);
      // Inner side back up
      ctx.lineTo(-shoulderW/2 + unit*0.08, sleeveTopY + unit*0.1);
      ctx.closePath();
      ctx.fill();

      // Right sleeve (mirrored)
      ctx.beginPath();
      ctx.moveTo(shoulderW/2 - unit*0.02, sleeveTopY);
      ctx.lineTo(shoulderW/2 + armW*0.5, sleeveTopY);
      ctx.lineTo(shoulderW/2 + armW*0.5, sleeveTopY + sleeveLen);
      ctx.lineTo(shoulderW/2 - unit*0.05, sleeveTopY + sleeveLen + unit*0.03);
      ctx.lineTo(shoulderW/2 - unit*0.08, sleeveTopY + unit*0.1);
      ctx.closePath();
      ctx.fill();

      // Sleeve cuff hem (thin shadow line)
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(-shoulderW/2 - armW*0.5, sleeveTopY + sleeveLen);
      ctx.lineTo(-shoulderW/2 + unit*0.05, sleeveTopY + sleeveLen + unit*0.03);
      ctx.moveTo(shoulderW/2 + armW*0.5, sleeveTopY + sleeveLen);
      ctx.lineTo(shoulderW/2 - unit*0.05, sleeveTopY + sleeveLen + unit*0.03);
      ctx.stroke();

      // ===== Neck (small skin patch) =====
      ctx.fillStyle = skin;
      ctx.fillRect(-unit*0.15, shoulderY - neckH*0.3, unit*0.3, neckH);

      // ===== Head =====
      ctx.fillStyle = skin;
      ctx.beginPath();
      ctx.arc(0, headY, headR, 0, Math.PI * 2);
      ctx.fill();

      if (facing === 'back') {
        // Back of head — full coverage (no face details)
        // Just leave skin-colored head; could add a small accent but keep clean.
      } else {
        // Front view — add face details (eyes and mouth)
        // No hair for now per user request.

        // Eyes — two small dark dots
        ctx.fillStyle = '#1a1a1a';
        const eyeY = headY - headR * 0.05;
        const eyeOffsetX = headR * 0.32;
        const eyeR = headR * 0.1;
        ctx.beginPath();
        ctx.arc(-eyeOffsetX, eyeY, eyeR, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(eyeOffsetX, eyeY, eyeR, 0, Math.PI * 2);
        ctx.fill();

        // Mouth — small subtle smile line
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 1.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-headR * 0.18, headY + headR * 0.4);
        ctx.quadraticCurveTo(0, headY + headR * 0.55,
                              headR * 0.18, headY + headR * 0.4);
        ctx.stroke();
      }

      // ===== Number on jersey (hide for back-facing — back numbers can be drawn here too if desired) =====
      if (facing !== 'back') {
        ctx.fillStyle = numberColor;
        const fontSize = Math.round(torsoH * 0.5);
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(o.number, 0, shoulderY + torsoH * 0.58);
      } else {
        // Back number (looks good on the back of jersey)
        ctx.fillStyle = numberColor;
        const fontSize = Math.round(torsoH * 0.55);
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(o.number, 0, shoulderY + torsoH * 0.58);
      }
      } // end of front/back view else block
    } else if (o.type === 'cone') {
      ctx.beginPath();
      ctx.ellipse(0, o.r * 0.9, o.r, o.r * 0.3, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-o.r * 0.7, o.r * 0.8);
      ctx.lineTo(0, -o.r);
      ctx.lineTo(o.r * 0.7, o.r * 0.8);
      ctx.closePath();
      const cgrad = ctx.createLinearGradient(-o.r, 0, o.r, 0);
      cgrad.addColorStop(0, '#cc4400');
      cgrad.addColorStop(0.5, '#ff7a2a');
      cgrad.addColorStop(1, '#cc4400');
      ctx.fillStyle = cgrad; ctx.fill();
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.moveTo(-o.r * 0.45, o.r * 0.1);
      ctx.lineTo(o.r * 0.45, o.r * 0.1);
      ctx.lineTo(o.r * 0.55, o.r * 0.3);
      ctx.lineTo(-o.r * 0.55, o.r * 0.3);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#333';
      ctx.fillRect(-o.r, o.r * 0.8, o.r * 2, 3);
    } else if (o.type === 'ball') {
      // Soccer ball with classic pentagon pattern
      const r = o.r;

      // Drop shadow
      ctx.beginPath();
      ctx.arc(1, 2, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fill();

      // White ball body
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Save state and clip to ball circle so all patterns stay inside
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, r - 0.5, 0, Math.PI * 2);
      ctx.clip();

      ctx.fillStyle = '#1a1a1a';
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 1;

      // Center pentagon (slightly above center for 3D feel)
      const cy = -r * 0.05;
      drawPentagon(ctx, 0, cy, r * 0.32, -Math.PI / 2);
      ctx.fill();

      // Surrounding 5 partial pentagons connected by lines
      // We draw small filled "patches" at the ball's edges
      const patchR = r * 0.22;
      const ringR = r * 0.78;
      for (let i = 0; i < 5; i++) {
        const ang = -Math.PI / 2 + (Math.PI * 2 / 5) * i + Math.PI / 5;
        const px = Math.cos(ang) * ringR;
        const py = Math.sin(ang) * ringR;
        // Edge patch (pentagon at the rim)
        drawPentagon(ctx, px, py, patchR, ang + Math.PI);
        ctx.fill();

        // Connecting line from center pentagon vertex to edge patch
        const innerAng = -Math.PI / 2 + (Math.PI * 2 / 5) * i;
        const innerVertX = Math.cos(innerAng) * r * 0.32;
        const innerVertY = cy + Math.sin(innerAng) * r * 0.32;
        ctx.beginPath();
        ctx.moveTo(innerVertX, innerVertY);
        ctx.lineTo(Math.cos(innerAng) * r * 0.55, Math.sin(innerAng) * r * 0.55 + cy * 0.5);
        ctx.stroke();
      }

      ctx.restore();

      // Subtle highlight (gloss on top-left)
      const hl = ctx.createRadialGradient(-r * 0.4, -r * 0.4, 0, -r * 0.4, -r * 0.4, r * 0.5);
      hl.addColorStop(0, 'rgba(255,255,255,0.6)');
      hl.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = hl;
      ctx.fill();
    } else if (o.type === 'goal') {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-o.r + 2, o.r * 0.4 + 2, o.r * 2, 4);
      ctx.strokeStyle = 'white'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-o.r, o.r * 0.4);
      ctx.lineTo(-o.r, -o.r * 0.5);
      ctx.lineTo(o.r, -o.r * 0.5);
      ctx.lineTo(o.r, o.r * 0.4);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
      for (let i = 1; i < 5; i++) {
        const x = -o.r + (o.r * 2 * i / 5);
        ctx.beginPath();
        ctx.moveTo(x, -o.r * 0.5); ctx.lineTo(x, o.r * 0.4);
        ctx.stroke();
      }
      for (let j = 1; j < 3; j++) {
        const y = -o.r * 0.5 + (o.r * 0.9 * j / 3);
        ctx.beginPath();
        ctx.moveTo(-o.r, y); ctx.lineTo(o.r, y);
        ctx.stroke();
      }
    }

    if (ui.selectedId === o.id) {
      ctx.strokeStyle = '#ffdd00';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      const ringR = o.type.startsWith('player') ? o.r * 2.2 : o.r + 6;
      ctx.arc(0, 0, ringR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if (ui.recording && ui.recordingTargetId === o.id) {
      ctx.strokeStyle = '#ff3333';
      ctx.lineWidth = 3;
      ctx.beginPath();
      const ringR = o.type.startsWith('player') ? o.r * 2.4 : o.r + 10;
      ctx.arc(0, 0, ringR, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function lighten(hex, amt) {
    const c = hex.replace('#', '');
    const r = Math.min(255, parseInt(c.slice(0,2),16) + amt*255);
    const g = Math.min(255, parseInt(c.slice(2,4),16) + amt*255);
    const b = Math.min(255, parseInt(c.slice(4,6),16) + amt*255);
    return `rgb(${r|0},${g|0},${b|0})`;
  }

  function darken(hex, amt) {
    const c = hex.replace('#', '');
    const r = Math.max(0, parseInt(c.slice(0,2),16) - amt*255);
    const g = Math.max(0, parseInt(c.slice(2,4),16) - amt*255);
    const b = Math.max(0, parseInt(c.slice(4,6),16) - amt*255);
    return `rgb(${r|0},${g|0},${b|0})`;
  }

  // Slim tapered leg (slightly narrower at ankle)
  function drawLeg(ctx, x, y, w, h) {
    const r = w * 0.35;
    const ankleW = w * 0.78;
    const ankleX = x + (w - ankleW) / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.quadraticCurveTo(x + w*0.5, y - 1, x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w * 0.96, y + r);
    // taper to ankle
    ctx.lineTo(ankleX + ankleW, y + h - r);
    ctx.quadraticCurveTo(ankleX + ankleW, y + h, ankleX + ankleW - r, y + h);
    ctx.lineTo(ankleX + r, y + h);
    ctx.quadraticCurveTo(ankleX, y + h, ankleX, y + h - r);
    ctx.lineTo(x + w * 0.04, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();
  }

  // Slim arm — slightly bent outward at elbow
  function drawArm(ctx, x, y, w, h, side /* -1 left, 1 right */) {
    const r = w * 0.45;
    const elbow = h * 0.5;
    const bend = w * 0.3 * side;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w + bend * 0.3, y + elbow);
    ctx.lineTo(x + w + bend, y + h - r);
    ctx.quadraticCurveTo(x + w + bend, y + h, x + w + bend - r, y + h);
    ctx.lineTo(x + r + bend * 0.7, y + h);
    ctx.quadraticCurveTo(x + bend * 0.7, y + h, x + bend * 0.7, y + h - r);
    ctx.lineTo(x + bend * 0.15, y + elbow);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();
  }

  // Pentagon for soccer ball pattern
  function drawPentagon(ctx, cx, cy, radius, rotation) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const ang = rotation + (Math.PI * 2 / 5) * i;
      const x = cx + Math.cos(ang) * radius;
      const y = cy + Math.sin(ang) * radius;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  // Helper: rounded rectangle path
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawArrow(ctx, a) {
    ctx.save();
    let color = '#ffdd00', width = 3, dash = [];
    if (a.type === 'arrow-dribble') { color = '#ffdd00'; width = 3; dash = []; }
    else if (a.type === 'arrow-pass') { color = '#4ade80'; width = 2.5; dash = [9, 6]; }
    else if (a.type === 'arrow-shoot') { color = '#f87171'; width = 5; dash = []; }

    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.setLineDash(dash);
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetY = 1;

    const ang = Math.atan2(a.y2 - a.y1, a.x2 - a.x1);
    const headSize = width * 3.2;
    const lineEndX = a.x2 - Math.cos(ang) * headSize * 0.6;
    const lineEndY = a.y2 - Math.sin(ang) * headSize * 0.6;

    ctx.beginPath();
    ctx.moveTo(a.x1, a.y1);
    ctx.lineTo(lineEndX, lineEndY);
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.shadowColor = 'transparent';

    ctx.save();
    ctx.translate(a.x2, a.y2);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-headSize, -headSize * 0.55);
    ctx.lineTo(-headSize * 0.6, 0);
    ctx.lineTo(-headSize, headSize * 0.55);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Order badge near start point (skip for preview drawing)
    if (typeof a.order === 'number') {
      const badgeX = a.x1 + Math.cos(ang) * 14;
      const badgeY = a.y1 + Math.sin(ang) * 14 - 14;
      // Cache badge position for hit testing
      a._badgeX = badgeX;
      a._badgeY = badgeY;
      ctx.beginPath();
      ctx.arc(badgeX, badgeY, 11, 0, Math.PI * 2);
      ctx.fillStyle = '#000';
      ctx.globalAlpha = 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(a.order + 1), badgeX, badgeY + 0.5);
    }

    ctx.restore();
  }

  function drawPaths() {
    pathCtx.clearRect(0, 0, W, H);

    // Hide arrows and movement trails during playback for cleaner motion view
    if (ui.playing) return;

    // Pen drawings (under arrows)
    (scene().drawings || []).forEach(d => drawPenStroke(pathCtx, d));
    if (ui.penStroke) drawPenStroke(pathCtx, ui.penStroke);

    scene().arrows.forEach(a => drawArrow(pathCtx, a));
    if (ui.arrowDrawing && ui.arrowDrawing.x2 != null) {
      drawArrow(pathCtx, ui.arrowDrawing);
    }

    scene().objects.forEach(o => {
      if (!o.keyframes || o.keyframes.length < 2) return;
      pathCtx.save();
      pathCtx.strokeStyle = (o.type.startsWith('player')) ? o.color : '#ffdd00';
      pathCtx.lineWidth = 2;
      pathCtx.setLineDash([5, 4]);
      pathCtx.globalAlpha = 0.55;
      pathCtx.beginPath();
      pathCtx.moveTo(o.keyframes[0].x, o.keyframes[0].y);
      for (let i = 1; i < o.keyframes.length; i++) {
        pathCtx.lineTo(o.keyframes[i].x, o.keyframes[i].y);
      }
      pathCtx.stroke();
      pathCtx.setLineDash([]);
      pathCtx.restore();
    });
  }

  function drawPenStroke(ctx, d) {
    if (!d.points || d.points.length === 0) return;
    ctx.save();
    ctx.strokeStyle = d.color || '#ffffff';
    ctx.lineWidth = d.width || 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 2;
    ctx.shadowOffsetY = 1;
    ctx.beginPath();
    ctx.moveTo(d.points[0].x, d.points[0].y);
    for (let i = 1; i < d.points.length; i++) {
      ctx.lineTo(d.points[i].x, d.points[i].y);
    }
    if (d.points.length === 1) {
      // Single tap = small dot
      ctx.arc(d.points[0].x, d.points[0].y, (d.width || 3) / 2, 0, Math.PI * 2);
      ctx.fillStyle = d.color || '#ffffff';
      ctx.fill();
    } else {
      ctx.stroke();
    }
    ctx.restore();
  }

  function redraw() {
    iconCtx.clearRect(0, 0, W, H);
    drawPaths();
    scene().objects.forEach(o => drawObject(iconCtx, o));
    updateInfo();
  }

  function updateInfo() {
    document.getElementById('objCount').textContent =
      `アイコン: ${scene().objects.length} / 矢印: ${scene().arrows.length}`;
    document.getElementById('timeTotal').textContent = scene().duration.toFixed(1);
    document.getElementById('timeNow').textContent = ui.playTime.toFixed(1);
    const pct = scene().duration > 0 ? (ui.playTime / scene().duration) * 100 : 0;
    document.getElementById('timelineFill').style.width = pct + '%';
  }

  function setTool(name) {
    if (name === 'record') {
      if (ui.recording) { cancelRecording(); return; }
      if (scene().objects.length === 0) {
        showHint('先にアイコンを配置してください');
        return;
      }
      armRecording();
      return;
    }
    if (name.startsWith('arrow-')) {
      ui.tool = name;
      ui.arrowDrawing = null;
      showArrowBanner(true, name);
    } else if (name === 'pen') {
      ui.tool = name;
      showArrowBanner(true, 'pen');
    } else {
      ui.tool = name;
      showArrowBanner(false);
    }
    document.querySelectorAll('.tool').forEach(b => {
      b.classList.toggle('active', b.dataset.tool === name);
    });
    if (ui.recording) cancelRecording();
  }

  document.querySelectorAll('.tool').forEach(b => {
    b.addEventListener('click', () => setTool(b.dataset.tool));
  });

  function showArrowBanner(show, type) {
    const el = document.getElementById('arrowBanner');
    el.classList.toggle('show', show);
    if (show) {
      const txt = type === 'pen' ? 'ペン: 自由に描いてください（ダブルタップで個別削除）' :
                  type === 'arrow-pass' ? 'パス矢印: 始点から終点へドラッグ（連続描画OK）' :
                  type === 'arrow-shoot' ? 'シュート矢印: 始点から終点へドラッグ（連続描画OK）' :
                  'ドリブル矢印: 始点から終点へドラッグ（連続描画OK）';
      document.getElementById('arrowBannerText').textContent = txt;
    }
  }

  function createObject(type, x, y) {
    saveHistory();
    const o = {
      id: Date.now() + Math.random(),
      type, x, y,
      keyframes: [{t: 0, x, y}],
    };
    if (type === 'player-blue')   { o.color = '#2563eb'; o.number = ++project.counters.blue;   o.r = 14; o.facing = 'front'; }
    else if (type === 'player-red')    { o.color = '#dc2626'; o.number = ++project.counters.red;    o.r = 14; o.facing = 'front'; }
    else if (type === 'player-yellow') { o.color = '#fbbf24'; o.number = ++project.counters.yellow; o.r = 14; o.facing = 'front'; }
    else if (type === 'cone')   { o.r = 14; }
    else if (type === 'ball')   { o.r = 13; }
    else if (type === 'goal')   { o.r = 28; }
    scene().objects.push(o);
    ui.selectedId = o.id;
    redraw();
  }

  function createArrow(type, x1, y1, x2, y2) {
    const dist = Math.hypot(x2 - x1, y2 - y1);
    if (dist < 15) return;
    saveHistory();

    // Auto-match: find the nearest target object to the start point
    const target = findNearestTarget(type, x1, y1);

    // Determine animation duration based on arrow type and distance
    let speed;
    if (type === 'arrow-shoot') speed = 600;
    else if (type === 'arrow-pass') speed = 400;
    else speed = 180;

    const moveDuration = Math.max(0.4, dist / speed);

    // Default order = (max existing order) + 1, so it plays AFTER previous arrows
    const maxOrder = scene().arrows.reduce((m, a) => Math.max(m, a.order), -1);
    const order = maxOrder + 1;

    scene().arrows.push({
      id: Date.now() + Math.random(),
      type, x1, y1, x2, y2,
      order,
      targetId: target ? target.id : null,
      moveDuration,
    });

    rebuildAnimation();
    redraw();
  }

  // Find which object should follow this arrow
  // dribble -> nearest player
  // pass / shoot -> nearest ball
  function findNearestTarget(arrowType, x, y) {
    const wantBall = (arrowType === 'arrow-pass' || arrowType === 'arrow-shoot');
    let best = null;
    let bestDist = Infinity;
    scene().objects.forEach(o => {
      const isPlayer = o.type.startsWith('player');
      const isBall = (o.type === 'ball');
      if (wantBall && !isBall) return;
      if (!wantBall && !isPlayer) return;
      // Use the object's INITIAL position (first keyframe) for matching
      // so re-running rebuild stays consistent.
      const ox = o.keyframes && o.keyframes[0] ? o.keyframes[0].x : o.x;
      const oy = o.keyframes && o.keyframes[0] ? o.keyframes[0].y : o.y;
      const d = Math.hypot(x - ox, y - oy);
      if (d < bestDist) { bestDist = d; best = o; }
    });
    return best;
  }

  // Rebuild keyframes for every object based on current arrows.
  // Arrows with the SAME `order` value play simultaneously.
  // Each group's duration = max moveDuration in that group.
  function rebuildAnimation() {
    const arrows = [...scene().arrows].sort((a,b) => a.order - b.order);

    // Reset all objects to keyframe[0] (their starting position)
    scene().objects.forEach(o => {
      const start = (o.keyframes && o.keyframes[0]) ? o.keyframes[0] : { x: o.x, y: o.y };
      o.keyframes = [{ t: 0, x: start.x, y: start.y }];
    });

    // Group arrows by order
    const groups = [];
    let curGroup = null;
    arrows.forEach(a => {
      if (!curGroup || curGroup.order !== a.order) {
        curGroup = { order: a.order, arrows: [] };
        groups.push(curGroup);
      }
      curGroup.arrows.push(a);
    });

    let timeline = 0;
    groups.forEach(group => {
      // duration of the whole group = max of contained arrows
      const groupDuration = Math.max(...group.arrows.map(a => a.moveDuration));

      // Track which objects are moved in this group (so they don't double-move)
      const movedInGroup = new Set();

      group.arrows.forEach(a => {
        const target = scene().objects.find(o => o.id === a.targetId);
        if (!target) return;
        if (movedInGroup.has(target.id)) return; // already moved by another arrow in this group
        movedInGroup.add(target.id);

        // Pad target's timeline up to current timeline
        const lastKf = target.keyframes[target.keyframes.length - 1];
        if (lastKf.t < timeline) {
          target.keyframes.push({ t: timeline, x: lastKf.x, y: lastKf.y });
        }

        // Snap target to arrow start, then move to arrow end
        target.keyframes.push({ t: timeline, x: a.x1, y: a.y1 });
        target.keyframes.push({ t: timeline + a.moveDuration, x: a.x2, y: a.y2 });

        // For dribble arrows, also move the nearest ball with the player
        // Ball should be at the PLAYER'S FEET, not at center
        if (a.type === 'arrow-dribble') {
          const ball = findNearestBallAt(a.x1, a.y1, timeline);
          if (ball && !movedInGroup.has(ball.id)) {
            movedInGroup.add(ball.id);
            // Foot offset: player center is roughly head/torso level;
            // feet are about target.r * 1.5 below center.
            // Add a small forward offset in the direction of motion.
            const dx = a.x2 - a.x1;
            const dy = a.y2 - a.y1;
            const len = Math.hypot(dx, dy) || 1;
            const dirX = dx / len;
            const dirY = dy / len;
            const footOffsetY = target.r * 1.5;
            const forwardOffset = target.r * 0.3;

            const ballStartX = a.x1 + dirX * forwardOffset;
            const ballStartY = a.y1 + footOffsetY + dirY * forwardOffset * 0.3;
            const ballEndX = a.x2 + dirX * forwardOffset;
            const ballEndY = a.y2 + footOffsetY + dirY * forwardOffset * 0.3;

            const ballLast = ball.keyframes[ball.keyframes.length - 1];
            if (ballLast.t < timeline) {
              ball.keyframes.push({ t: timeline, x: ballLast.x, y: ballLast.y });
            }
            ball.keyframes.push({ t: timeline, x: ballStartX, y: ballStartY });
            ball.keyframes.push({ t: timeline + a.moveDuration, x: ballEndX, y: ballEndY });
          }
        }
      });

      timeline += groupDuration;
    });

    scene().duration = timeline;

    // Reset visual positions to initial
    scene().objects.forEach(o => {
      if (o.keyframes && o.keyframes[0]) {
        o.x = o.keyframes[0].x;
        o.y = o.keyframes[0].y;
      }
    });
  }

  // Find ball that's near a point at a given time (uses last known position from keyframes)
  function findNearestBallAt(x, y, t) {
    let best = null;
    let bestDist = Infinity;
    scene().objects.forEach(o => {
      if (o.type !== 'ball') return;
      // Get position at time t
      let bx = o.keyframes[0].x, by = o.keyframes[0].y;
      for (let i = 0; i < o.keyframes.length; i++) {
        if (o.keyframes[i].t <= t) { bx = o.keyframes[i].x; by = o.keyframes[i].y; }
      }
      const d = Math.hypot(x - bx, y - by);
      if (d < bestDist) { bestDist = d; best = o; }
    });
    return (best && bestDist < 80) ? best : null;
  }

  function hitTest(x, y) {
    for (let i = scene().objects.length - 1; i >= 0; i--) {
      const o = scene().objects[i];
      const dx = x - o.x, dy = y - o.y;
      const hitR = o.type.startsWith('player') ? o.r * 2.2 : o.r + 6;
      if (dx*dx + dy*dy <= hitR * hitR) return o;
    }
    return null;
  }

  function arrowHitTest(x, y) {
    for (let i = scene().arrows.length - 1; i >= 0; i--) {
      const a = scene().arrows[i];
      const A = x - a.x1, B = y - a.y1;
      const C = a.x2 - a.x1, D = a.y2 - a.y1;
      const dot = A*C + B*D;
      const lenSq = C*C + D*D;
      let param = lenSq ? dot / lenSq : -1;
      param = Math.max(0, Math.min(1, param));
      const xx = a.x1 + param * C;
      const yy = a.y1 + param * D;
      if (Math.hypot(x - xx, y - yy) < 12) return a;
    }
    return null;
  }

  function badgeHitTest(x, y) {
    for (let i = scene().arrows.length - 1; i >= 0; i--) {
      const a = scene().arrows[i];
      if (typeof a._badgeX !== 'number') continue;
      const d = Math.hypot(x - a._badgeX, y - a._badgeY);
      if (d < 14) return a;
    }
    return null;
  }

  function drawingHitTest(x, y) {
    const drawings = scene().drawings || [];
    for (let i = drawings.length - 1; i >= 0; i--) {
      const d = drawings[i];
      for (const p of d.points) {
        if (Math.hypot(x - p.x, y - p.y) < 10) return d;
      }
    }
    return null;
  }

  // ---------- Order picker ----------
  let orderPickerArrowId = null;

  function showOrderPicker(arrow, x, y) {
    orderPickerArrowId = arrow.id;
    const picker = document.getElementById('orderPicker');
    const optsDiv = document.getElementById('orderPickerOptions');
    const targetsDiv = document.getElementById('orderPickerTargets');

    // ----- Order numbers -----
    const maxOrder = scene().arrows.reduce((m, a) => Math.max(m, a.order), 0);
    const choices = [];
    for (let o = 0; o <= maxOrder + 1; o++) choices.push(o);

    optsDiv.innerHTML = '';
    choices.forEach(o => {
      const btn = document.createElement('button');
      btn.textContent = String(o + 1);
      const isCurrent = o === arrow.order;
      btn.style.cssText = `
        background: ${isCurrent ? '#ffdd00' : 'rgba(255,255,255,0.08)'};
        color: ${isCurrent ? '#000' : '#f5f5f0'};
        border: 1px solid ${isCurrent ? '#ffdd00' : 'transparent'};
        width: 32px; height: 32px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        font-size: 13px;
      `;
      const handlePick = (ev) => {
        ev.stopPropagation();
        ev.preventDefault();
        const a = scene().arrows.find(x => x.id === orderPickerArrowId);
        if (!a) return;
        saveHistory();
        a.order = o;
        normalizeOrders();
        rebuildAnimation();
        hideOrderPicker();
        redraw();
      };
      btn.addEventListener('click', handlePick);
      btn.addEventListener('touchstart', handlePick, { passive: false });
      optsDiv.appendChild(btn);
    });

    // ----- Targets (which object the arrow moves) -----
    targetsDiv.innerHTML = '';
    // Filter: dribble arrows can target players; pass/shoot can target balls.
    // But to give flexibility, show all sensible candidates.
    const candidates = scene().objects.filter(o => {
      if (arrow.type === 'arrow-dribble') return o.type.startsWith('player');
      // pass / shoot
      return o.type === 'ball' || o.type.startsWith('player');
    });

    if (candidates.length === 0) {
      const msg = document.createElement('div');
      msg.style.cssText = 'font-size: 10px; color: #a0a89c; padding: 4px;';
      msg.textContent = '対象アイコンがありません';
      targetsDiv.appendChild(msg);
    }

    candidates.forEach(target => {
      const btn = document.createElement('button');
      const isCurrent = target.id === arrow.targetId;

      // Label: 青1, 赤2, ボール etc.
      let label = '';
      if (target.type === 'player-blue') label = `青${target.number}`;
      else if (target.type === 'player-red') label = `赤${target.number}`;
      else if (target.type === 'player-yellow') label = `黄${target.number}`;
      else if (target.type === 'ball') label = '⚽';

      // Color based on target type
      let bg = 'rgba(255,255,255,0.08)';
      let fg = '#f5f5f0';
      if (isCurrent) {
        if (target.type === 'player-blue') { bg = '#2563eb'; fg = '#fff'; }
        else if (target.type === 'player-red') { bg = '#dc2626'; fg = '#fff'; }
        else if (target.type === 'player-yellow') { bg = '#fbbf24'; fg = '#222'; }
        else if (target.type === 'ball') { bg = '#fff'; fg = '#000'; }
      }

      btn.textContent = label;
      btn.style.cssText = `
        background: ${bg};
        color: ${fg};
        border: 1px solid ${isCurrent ? '#ffdd00' : 'transparent'};
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        font-size: 12px;
        min-width: 36px;
      `;
      const handlePick = (ev) => {
        ev.stopPropagation();
        ev.preventDefault();
        const a = scene().arrows.find(x => x.id === orderPickerArrowId);
        if (!a) return;
        saveHistory();
        a.targetId = target.id;
        rebuildAnimation();
        hideOrderPicker();
        redraw();
      };
      btn.addEventListener('click', handlePick);
      btn.addEventListener('touchstart', handlePick, { passive: false });
      targetsDiv.appendChild(btn);
    });

    // ----- Position the picker -----
    const wrapRect = fieldWrap.getBoundingClientRect();
    picker.style.display = 'block';
    const pw = picker.offsetWidth || 220;
    const ph = picker.offsetHeight || 180;
    let px = x + 14;
    let py = y - ph / 2;
    if (px + pw > wrapRect.width - 8) px = x - pw - 14;
    if (px < 8) px = 8;
    if (py < 8) py = 8;
    if (py + ph > wrapRect.height - 8) py = wrapRect.height - ph - 8;
    picker.style.left = px + 'px';
    picker.style.top = py + 'px';
  }

  function hideOrderPicker() {
    document.getElementById('orderPicker').style.display = 'none';
    orderPickerArrowId = null;
  }

  function normalizeOrders() {
    const uniqueOrders = [...new Set(scene().arrows.map(a => a.order))].sort((a,b) => a - b);
    const map = new Map();
    uniqueOrders.forEach((o, i) => map.set(o, i));
    scene().arrows.forEach(a => { a.order = map.get(a.order); });
  }

  document.getElementById('orderPickerDelete').addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (!orderPickerArrowId) return;
    const id = orderPickerArrowId;
    hideOrderPicker();
    deleteArrow(id);
  });

  // ---------- Facing picker (player body direction) ----------
  let facingPickerPlayerId = null;
  const facingPicker = document.getElementById('facingPicker');

  function showFacingPicker(player, x, y) {
    facingPickerPlayerId = player.id;
    const wrapRect = fieldWrap.getBoundingClientRect();

    // Highlight currently selected facing
    document.querySelectorAll('.facing-btn').forEach(b => {
      const isCur = b.dataset.facing === (player.facing || 'front');
      b.style.background = isCur ? '#ffdd00' : 'rgba(255,255,255,0.08)';
      b.style.color = isCur ? '#000' : '#f5f5f0';
      b.style.borderColor = isCur ? '#ffdd00' : 'transparent';
    });

    facingPicker.style.display = 'block';
    const pw = facingPicker.offsetWidth || 200;
    const ph = facingPicker.offsetHeight || 90;
    let px = x + 14;
    let py = y - ph / 2;
    if (px + pw > wrapRect.width - 8) px = x - pw - 14;
    if (px < 8) px = 8;
    if (py < 8) py = 8;
    if (py + ph > wrapRect.height - 8) py = wrapRect.height - ph - 8;
    facingPicker.style.left = px + 'px';
    facingPicker.style.top = py + 'px';
  }

  function hideFacingPicker() {
    facingPicker.style.display = 'none';
    facingPickerPlayerId = null;
  }

  document.querySelectorAll('.facing-btn').forEach(b => {
    const handler = (ev) => {
      ev.stopPropagation();
      ev.preventDefault();
      if (!facingPickerPlayerId) return;
      const p = scene().objects.find(o => o.id === facingPickerPlayerId);
      if (!p) return;
      saveHistory();
      p.facing = b.dataset.facing;
      hideFacingPicker();
      redraw();
    };
    b.addEventListener('click', handler);
    b.addEventListener('touchstart', handler, { passive: false });
  });

  document.getElementById('facingPickerDelete').addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (!facingPickerPlayerId) return;
    const id = facingPickerPlayerId;
    hideFacingPicker();
    deleteObject(id);
  });

  // Block events from picker bubbling
  ['mousedown', 'touchstart', 'pointerdown', 'click'].forEach(evtName => {
    facingPicker.addEventListener(evtName, (ev) => ev.stopPropagation());
  });

  // Block pointer events from inside the picker bubbling to fieldWrap's pointer handlers.
  ['mousedown', 'touchstart', 'pointerdown', 'click'].forEach(evtName => {
    document.getElementById('orderPicker').addEventListener(evtName, (ev) => {
      ev.stopPropagation();
    });
  });

  function getPos(e) {
    const rect = fieldWrap.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  let lastTap = 0;

  function pointerDown(e) {
    e.preventDefault();
    const { x, y } = getPos(e);
    if (ui.playing) return;

    if (ui.recording) {
      const hit = hitTest(x, y);
      if (hit) {
        ui.recordingTargetId = hit.id;
        ui.selectedId = hit.id;
        hit.keyframes = [{t: 0, x: hit.x, y: hit.y}];
        ui.dragging = { id: hit.id, dx: x - hit.x, dy: y - hit.y, recording: true };
        ui.recordStartTime = performance.now();
        ui.recordPath = [{t: 0, x: hit.x, y: hit.y}];
        updateRecBanner('録画中... 指/マウスを離すと完了');
        redraw();
      } else {
        showHint('動かしたいアイコンを直接ドラッグしてください');
      }
      return;
    }

    if (ui.tool.startsWith('arrow-')) {
      ui.arrowDrawing = { type: ui.tool, x1: x, y1: y, x2: x, y2: y };
      return;
    }

    if (ui.tool === 'pen') {
      ui.penStroke = {
        id: Date.now() + Math.random(),
        color: '#ffffff',
        width: 3,
        points: [{ x, y }],
      };
      return;
    }

    if (ui.tool === 'select') {
      // First: badge tap → order picker
      const badge = badgeHitTest(x, y);
      if (badge) {
        showOrderPicker(badge, x, y);
        return;
      }

      const hit = hitTest(x, y);
      if (hit) {
        ui.selectedId = hit.id;
        ui.dragging = { id: hit.id, dx: x - hit.x, dy: y - hit.y };
        const now = Date.now();
        if (now - lastTap < 350 && hit.id === ui._lastTapId) {
          // Double-tap on player → show facing/delete picker
          // Double-tap on other objects (cone, ball, goal) → delete
          if (hit.type.startsWith('player')) {
            ui.dragging = null;
            showFacingPicker(hit, x, y);
          } else {
            deleteObject(hit.id);
            ui.dragging = null;
          }
        }
        lastTap = now;
        ui._lastTapId = hit.id;
      } else {
        const arr = arrowHitTest(x, y);
        if (arr) {
          showOrderPicker(arr, x, y);
        } else {
          // Check if a pen drawing was tapped — double-tap to delete
          const drawing = drawingHitTest(x, y);
          if (drawing) {
            const now = Date.now();
            if (now - lastTap < 350 && ui._lastTapId === drawing.id) {
              deletePenDrawing(drawing.id);
            } else {
              showHint('ペン描画はダブルタップで削除できます');
            }
            lastTap = now;
            ui._lastTapId = drawing.id;
          } else {
            ui.selectedId = null;
            hideOrderPicker();
          }
        }
      }
      redraw();
      return;
    }

    createObject(ui.tool, x, y);
    setTimeout(() => setTool('select'), 50);
  }

  function pointerMove(e) {
    const { x, y } = getPos(e);

    if (ui.arrowDrawing) {
      e.preventDefault();
      ui.arrowDrawing.x2 = x;
      ui.arrowDrawing.y2 = y;
      drawPaths();
      return;
    }

    if (ui.penStroke) {
      e.preventDefault();
      const last = ui.penStroke.points[ui.penStroke.points.length - 1];
      // Throttle: only add points that are at least 2px from last
      if (Math.hypot(x - last.x, y - last.y) >= 2) {
        ui.penStroke.points.push({ x, y });
        drawPaths();
      }
      return;
    }

    if (!ui.dragging) return;
    e.preventDefault();
    const o = scene().objects.find(obj => obj.id === ui.dragging.id);
    if (!o) return;
    o.x = clamp(x - ui.dragging.dx, 10, W - 10);
    o.y = clamp(y - ui.dragging.dy, 10, H - 10);

    if (ui.dragging.recording) {
      const t = (performance.now() - ui.recordStartTime) / 1000;
      ui.recordPath.push({t, x: o.x, y: o.y});
    } else {
      o.keyframes[0] = {t: 0, x: o.x, y: o.y};
    }
    redraw();
  }

  function pointerUp(e) {
    if (ui.arrowDrawing) {
      const a = ui.arrowDrawing;
      createArrow(a.type, a.x1, a.y1, a.x2, a.y2);
      ui.arrowDrawing = null;
      drawPaths();
      return;
    }
    if (ui.penStroke) {
      // Save the stroke if it has any meaningful content
      if (ui.penStroke.points.length > 0) {
        saveHistory();
        if (!scene().drawings) scene().drawings = [];
        scene().drawings.push(ui.penStroke);
      }
      ui.penStroke = null;
      drawPaths();
      return;
    }
    if (ui.dragging && ui.dragging.recording) {
      finishRecording();
    } else if (ui.dragging && !ui.dragging.recording) {
      if (scene().arrows.length > 0) {
        rebuildAnimation();
        redraw();
      }
    }
    ui.dragging = null;
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  // Use Pointer Events API for unified mouse/touch/stylus handling
  fieldWrap.addEventListener('pointerdown', pointerDown);
  fieldWrap.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);
  window.addEventListener('pointercancel', pointerUp);
  // Prevent default touch behaviors (scrolling, zoom) on the field
  fieldWrap.style.touchAction = 'none';

  function armRecording() {
    ui.recording = true;
    ui.recordingTargetId = null;
    ui.tool = 'select';
    document.querySelectorAll('.tool').forEach(b => {
      b.classList.toggle('active', b.dataset.tool === 'record');
    });
    updateRecBanner('動かしたいアイコンをドラッグしてください');
    showRecBanner(true);
    showArrowBanner(false);
    redraw();
  }
  function cancelRecording() {
    ui.recording = false;
    ui.recordingTargetId = null;
    ui.recordPath = [];
    showRecBanner(false);
    document.querySelectorAll('.tool').forEach(b => {
      b.classList.toggle('active', b.dataset.tool === 'select');
    });
    redraw();
  }
  function finishRecording() {
    const target = scene().objects.find(o => o.id === ui.recordingTargetId);
    if (target && ui.recordPath.length > 1) {
      const simplified = [];
      for (let i = 0; i < ui.recordPath.length; i += 3) simplified.push(ui.recordPath[i]);
      const last = ui.recordPath[ui.recordPath.length - 1];
      if (simplified[simplified.length - 1] !== last) simplified.push(last);
      target.keyframes = simplified;
      scene().duration = Math.max(scene().duration, last.t);
      showHint(`動きを記録しました（${last.t.toFixed(1)}秒）`);
    } else {
      showHint('動きが短すぎます');
    }
    ui.recordPath = [];
    ui.recording = false;
    ui.recordingTargetId = null;
    showRecBanner(false);
    document.querySelectorAll('.tool').forEach(b => {
      b.classList.toggle('active', b.dataset.tool === 'select');
    });
    redraw();
  }
  function showRecBanner(show) {
    document.getElementById('recBanner').classList.toggle('show', show);
  }
  function updateRecBanner(text) {
    document.getElementById('recBannerText').textContent = text;
  }
  document.getElementById('recCancel').addEventListener('click', cancelRecording);
  document.getElementById('arrowCancel').addEventListener('click', () => setTool('select'));

  function applyTime(t, sc = scene()) {
    sc.objects.forEach(o => {
      if (!o.keyframes || o.keyframes.length === 0) return;
      const kf = o.keyframes;
      if (t <= kf[0].t) { o.x = kf[0].x; o.y = kf[0].y; return; }
      if (t >= kf[kf.length-1].t) { o.x = kf[kf.length-1].x; o.y = kf[kf.length-1].y; return; }
      for (let i = 0; i < kf.length - 1; i++) {
        if (t >= kf[i].t && t <= kf[i+1].t) {
          const r = (t - kf[i].t) / (kf[i+1].t - kf[i].t || 1);
          o.x = kf[i].x + (kf[i+1].x - kf[i].x) * r;
          o.y = kf[i].y + (kf[i+1].y - kf[i].y) * r;
          break;
        }
      }
    });
  }

  function play() {
    if (scene().duration === 0 && !ui.playAll) {
      showHint('まず動きを記録してください');
      return;
    }
    ui.playing = true;
    ui.playStart = performance.now() - (ui.playTime / ui.speed) * 1000;
    document.getElementById('playIcon').innerHTML = '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>';
    // Clear arrows/trails immediately when playback starts
    pathCtx.clearRect(0, 0, W, H);
    requestAnimationFrame(playLoop);
  }
  function pause() {
    ui.playing = false;
    ui.playAll = false;
    document.getElementById('playIcon').innerHTML = '<polygon points="6 4 20 12 6 20 6 4"/>';
    // Redraw paths now that playback stopped (so arrows reappear)
    drawPaths();
  }
  function playLoop(now) {
    if (!ui.playing) return;
    ui.playTime = ((now - ui.playStart) / 1000) * ui.speed;

    if (ui.playTime >= scene().duration) {
      ui.playTime = scene().duration;
      if (ui.playAll && ui.playAllSceneIdx < project.scenes.length - 1) {
        ui.playAllSceneIdx++;
        switchScene(ui.playAllSceneIdx, true);
        ui.playTime = 0;
        ui.playStart = performance.now();
        applyTime(0);
        redraw();
        if (ui.playing) requestAnimationFrame(playLoop);
        return;
      }
      pause();
    }
    applyTime(ui.playTime);
    redraw();
    if (ui.playing) requestAnimationFrame(playLoop);
  }

  document.getElementById('playBtn').addEventListener('click', () => {
    if (ui.playing) pause();
    else {
      ui.playAll = false;
      if (ui.playTime >= scene().duration) ui.playTime = 0;
      scene().objects.forEach(o => {
        if (o.keyframes && o.keyframes[0]) { o.x = o.keyframes[0].x; o.y = o.keyframes[0].y; }
      });
      play();
    }
  });

  document.getElementById('playAllBtn').addEventListener('click', () => {
    pause();
    ui.playAll = true;
    ui.playAllSceneIdx = 0;
    switchScene(0, true);
    ui.playTime = 0;
    scene().objects.forEach(o => {
      if (o.keyframes && o.keyframes[0]) { o.x = o.keyframes[0].x; o.y = o.keyframes[0].y; }
    });
    play();
  });

  document.getElementById('timeline').addEventListener('click', (e) => {
    if (scene().duration === 0) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    ui.playTime = scene().duration * ratio;
    applyTime(ui.playTime);
    redraw();
  });

  document.querySelectorAll('.speed-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.speed-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      ui.speed = parseFloat(b.dataset.speed);
      if (ui.playing) {
        ui.playStart = performance.now() - (ui.playTime / ui.speed) * 1000;
      }
    });
  });

  function renderScenes() {
    const bar = document.getElementById('scenesBar');
    bar.innerHTML = '';
    project.scenes.forEach((s, i) => {
      const tab = document.createElement('div');
      tab.className = 'scene-tab' + (i === project.activeIdx ? ' active' : '');
      tab.innerHTML = `<span class="scene-num">${i+1}</span><span>${escapeHtml(s.name)}</span>`;
      tab.addEventListener('click', () => switchScene(i));
      bar.appendChild(tab);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'scene-add';
    addBtn.textContent = '+';
    addBtn.title = '新しいシーンを追加';
    addBtn.addEventListener('click', addScene);
    bar.appendChild(addBtn);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }
  function switchScene(idx, keepPlay = false) {
    if (!keepPlay) pause();
    project.activeIdx = idx;
    ui.selectedId = null;
    ui.playTime = 0;
    if (!keepPlay) {
      scene().objects.forEach(o => {
        if (o.keyframes && o.keyframes[0]) { o.x = o.keyframes[0].x; o.y = o.keyframes[0].y; }
      });
    }
    renderScenes();
    redraw();
  }
  function addScene() {
    pause();
    saveHistory();
    project.scenes.push({
      name: `シーン ${project.scenes.length + 1}`,
      objects: [],
      arrows: [],
      drawings: [],
      duration: 0,
    });
    project.activeIdx = project.scenes.length - 1;
    renderScenes();
    redraw();
  }
  function duplicateScene() {
    saveHistory();
    const src = scene();
    const copy = {
      name: src.name + ' (コピー)',
      duration: src.duration,
      objects: JSON.parse(JSON.stringify(src.objects)).map(o => ({ ...o, id: Date.now() + Math.random() })),
      arrows: JSON.parse(JSON.stringify(src.arrows)).map(a => ({ ...a, id: Date.now() + Math.random() })),
      drawings: JSON.parse(JSON.stringify(src.drawings || [])).map(d => ({ ...d, id: Date.now() + Math.random() })),
    };
    project.scenes.splice(project.activeIdx + 1, 0, copy);
    project.activeIdx++;
    renderScenes();
    redraw();
  }
  function deleteCurrentScene() {
    if (project.scenes.length === 1) {
      showHint('最後のシーンは削除できません');
      return;
    }
    if (!confirm(`「${scene().name}」を削除しますか？`)) return;
    saveHistory();
    project.scenes.splice(project.activeIdx, 1);
    if (project.activeIdx >= project.scenes.length) project.activeIdx = project.scenes.length - 1;
    renderScenes();
    redraw();
  }
  function clearCurrentScene() {
    if (!confirm('このシーンの内容をすべてクリアしますか？')) return;
    saveHistory();
    scene().objects = [];
    scene().arrows = [];
    scene().drawings = [];
    scene().duration = 0;
    ui.selectedId = null;
    redraw();
  }

  const modalBg = document.getElementById('modalBg');
  const modalInput = document.getElementById('modalInput');
  let modalCallback = null;
  function openModal(title, defaultVal, cb) {
    document.getElementById('modalTitle').textContent = title;
    modalInput.value = defaultVal || '';
    modalCallback = cb;
    modalBg.classList.add('show');
    setTimeout(() => modalInput.focus(), 50);
  }
  function closeModal() {
    modalBg.classList.remove('show');
    modalCallback = null;
  }
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalOk').addEventListener('click', () => {
    if (modalCallback) modalCallback(modalInput.value.trim());
    closeModal();
  });
  modalInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (modalCallback) modalCallback(modalInput.value.trim());
      closeModal();
    } else if (e.key === 'Escape') closeModal();
  });

  function deleteObject(id) {
    saveHistory();
    scene().objects = scene().objects.filter(o => o.id !== id);
    // Remove arrows that were targeting this object
    scene().arrows = scene().arrows.filter(a => a.targetId !== id);
    // Renumber arrows
    scene().arrows.forEach((a, i) => a.order = i);
    rebuildAnimation();
    ui.selectedId = null;
    redraw();
  }
  function deleteArrow(id) {
    saveHistory();
    scene().arrows = scene().arrows.filter(a => a.id !== id);
    // Renumber
    scene().arrows.forEach((a, i) => a.order = i);
    rebuildAnimation();
    redraw();
  }

  function deletePenDrawing(id) {
    saveHistory();
    scene().drawings = (scene().drawings || []).filter(d => d.id !== id);
    redraw();
  }

  function saveHistory() {
    ui.history.push({
      scenes: JSON.parse(JSON.stringify(project.scenes)),
      activeIdx: project.activeIdx,
      counters: { ...project.counters },
    });
    if (ui.history.length > 30) ui.history.shift();
  }
  document.getElementById('undoBtn').addEventListener('click', () => {
    if (ui.history.length === 0) { showHint('元に戻す履歴がありません'); return; }
    const prev = ui.history.pop();
    project.scenes = prev.scenes;
    project.activeIdx = prev.activeIdx;
    project.counters = prev.counters;
    ui.selectedId = null;
    renderScenes();
    redraw();
  });

  const menu = document.getElementById('menu');
  const settingsPanel = document.getElementById('settingsPanel');

  document.getElementById('menuBtn').addEventListener('click', e => {
    e.stopPropagation();
    settingsPanel.classList.remove('show');
    menu.classList.toggle('show');
  });
  document.getElementById('settingsBtn').addEventListener('click', e => {
    e.stopPropagation();
    menu.classList.remove('show');
    settingsPanel.classList.toggle('show');
  });
  document.addEventListener('click', () => {
    menu.classList.remove('show');
    settingsPanel.classList.remove('show');
  });
  // Prevent panel clicks from closing
  settingsPanel.addEventListener('click', e => e.stopPropagation());

  // Settings toggle handlers
  const linesToggle = document.getElementById('settingShowLines');
  const stripesToggle = document.getElementById('settingShowStripes');

  // Initialize toggle states from saved settings
  linesToggle.checked = settings.showLines;
  stripesToggle.checked = settings.showStripes;

  linesToggle.addEventListener('change', () => {
    settings.showLines = linesToggle.checked;
    saveSettings();
    drawBackground();
  });
  stripesToggle.addEventListener('change', () => {
    settings.showStripes = stripesToggle.checked;
    saveSettings();
    applyStripesSetting();
  });

  document.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', () => {
      const a = item.dataset.action;
      if (a === 'renameScene') {
        openModal('シーン名を変更', scene().name, (val) => {
          if (val) { scene().name = val; renderScenes(); }
        });
      } else if (a === 'duplicateScene') duplicateScene();
      else if (a === 'deleteScene') deleteCurrentScene();
      else if (a === 'clearScene') clearCurrentScene();
      else if (a === 'save') {
        const data = JSON.stringify(project, null, 2);
        const blob = new Blob([data], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = 'training.json'; link.click();
        URL.revokeObjectURL(url);
        showHint('保存しました');
      } else if (a === 'load') {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'application/json';
        inp.onchange = (e) => {
          const f = e.target.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = () => {
            try {
              const d = JSON.parse(r.result);
              if (d.scenes) {
                project.scenes = d.scenes;
                project.activeIdx = d.activeIdx || 0;
                project.counters = d.counters || {blue:0,red:0,yellow:0};
              } else if (d.objects) {
                project.scenes = [{
                  name: 'シーン 1',
                  objects: d.objects,
                  arrows: [],
                  duration: d.duration || 0,
                }];
                project.activeIdx = 0;
                project.counters = d.counters || {blue:0,red:0,yellow:0};
              }
              ui.playTime = 0;
              renderScenes();
              redraw();
              showHint('読み込みました');
            } catch { showHint('読み込みに失敗しました'); }
          };
          r.readAsText(f);
        };
        inp.click();
      } else if (a === 'help') {
        alert(
          '【使い方】\n\n' +
          '◆ 基本フロー\n①アイコンを配置 → ②矢印を引く → ③▶で再生\n矢印を引くだけで自動的にその通り動きます！\n\n' +
          '◆ 矢印の種類\n🟡 ドリブル矢印（黄・実線）→ 近くの選手が動く（ボールも一緒に運ぶ）\n🟢 パス矢印（緑・破線）→ 近くのボールが飛ぶ\n🔴 シュート矢印（赤・太線）→ ボールが速く飛ぶ\n\n' +
          '◆ 順番と同時動作\n矢印に①②③と番号が表示されます\nバッジをタップ → 同じ番号の矢印は「同時に」動きます\n\n' +
          '◆ ペン（手描き）\nペンツールで自由に線を引いて作戦に印を付けられます\n\n' +
          '◆ 選手の体の向き\n選手をダブルタップ → 前/後/左/右の向きを選択\n\n' +
          '◆ 削除\n選手: ダブルタップ → 「この選手を削除」\nコーン/ボール/ゴール: ダブルタップで即削除\n矢印/ペン: ダブルタップで削除\n\n' +
          '◆ 録画機能\nジグザグなど直線で表せない動きは録画ボタンで個別に記録\n\n' +
          '◆ シーン\n上部の「+」で新シーン。フェーズごとに分けて全再生で連続再生\n\n' +
          '◆ 速度\n0.5x / 1x / 2x で再生速度変更（PC）'
        );
      }
    });
  });

  let hintTimer = null;
  function showHint(msg, duration = 3000) {
    const el = document.getElementById('hint');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => el.classList.remove('show'), duration);
  }

  function init() {
    applyStripesSetting();
    resize();
    renderScenes();
    setTimeout(() => {
      showHint('矢印を引くと自動で動きます。番号バッジをタップで「同時に動く」設定も可能', 5500);
    }, 400);
  }
  init();

})();
</script>

</body>
</html>
